name: macOS Remote Desktop

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'App to pre-install and open on desktop'
        required: true
        type: choice
        default: 'central'
        options:
          - 'central'
          - 'curve'
          - 'prism'
          - 'frame'
          - 'reel'
          - 'surface'
          - 'forge'
          - 'anima'
          - 'kinetic'
          - 'lux'
          - 'folio'
          - 'editorial'
          - 'sonic'
          - 'all'

jobs:
  desktop:
    runs-on: macos-latest
    timeout-minutes: 360 # Up to 6 hours session

    steps:
      - name: Checkout Builder
        uses: actions/checkout@v4

      - name: Setup Tools (cliclick, bore-cli)
        run: |
          echo "==> Disabling display sleep..."
          sudo pmset -a displaysleep 0 sleep 0 disksleep 0 || true
          caffeinate -d -i -m -u &
          
          echo "==> Installing cliclick and bore-cli..."
          brew install cliclick bore-cli

      - name: Download and Mount Selected App(s)
        env:
          APP: ${{ inputs.app }}
          FORGE_TOKEN: ${{ secrets.FORGE_TOKEN }}
        run: |
          DOWNLOAD_DIR="$HOME/Desktop/Yume_Apps"
          mkdir -p "$DOWNLOAD_DIR"
          
          APPS_TO_GET=()
          if [[ "$APP" == "all" ]]; then
            APPS_TO_GET=("central" "curve" "prism" "frame" "reel" "surface" "forge" "anima" "kinetic" "lux" "folio" "editorial" "sonic")
          else
            APPS_TO_GET=("$APP")
          fi
          
          for a in "${APPS_TO_GET[@]}"; do
            echo "==> Fetching latest release info for $a from Gitea..."
            REL_JSON=$(curl -s -f -H "Authorization: token $FORGE_TOKEN" "https://code.yumedevs.com/api/v1/repos/Alejandro/${a}/releases/latest" 2>/dev/null || true)
            if [[ -z "$REL_JSON" ]]; then
              echo "Warning: Could not fetch release for $a"
              continue
            fi
            
            DMG_URL=$(python3 -c "import sys, json; data=json.loads(sys.stdin.read()); print(next((x['browser_download_url'] for x in data.get('assets',[]) if x['name'].endswith('.dmg')), ''))" <<< "$REL_JSON")
            DMG_NAME=$(python3 -c "import sys, json; data=json.loads(sys.stdin.read()); print(next((x['name'] for x in data.get('assets',[]) if x['name'].endswith('.dmg')), ''))" <<< "$REL_JSON")
            
            if [[ -n "$DMG_URL" && -n "$DMG_NAME" ]]; then
              echo "==> Downloading $DMG_NAME..."
              curl -s -f -H "Authorization: token $FORGE_TOKEN" "$DMG_URL" -o "$DOWNLOAD_DIR/$DMG_NAME"
              echo "==> Mounting $DMG_NAME..."
              hdiutil attach "$DOWNLOAD_DIR/$DMG_NAME" || true
            fi
          done
          
          # Remove quarantine attributes to prevent any Gatekeeper dialogs
          xattr -cr "$DOWNLOAD_DIR" 2>/dev/null || true
          
          # Copy all mounted apps into /Applications
          find /Volumes -maxdepth 3 -name "*.app" ! -path "*/Macintosh HD*" 2>/dev/null | while read -r app_path; do
            echo "==> Copying $app_path to /Applications..."
            sudo cp -R "$app_path" /Applications/ || true
            app_name=$(basename "$app_path")
            xattr -cr "/Applications/$app_name" 2>/dev/null || true
          done

          # Determine target app to pre-launch on macOS display
          TARGET_APP="$APP"
          if [[ "$TARGET_APP" == "all" || "$TARGET_APP" == "central" ]]; then
            TARGET_APP="Central"
          fi

          LAUNCH_PATH=$(find /Applications -maxdepth 1 -iname "*$TARGET_APP*.app" 2>/dev/null | head -n 1)
          if [[ -z "$LAUNCH_PATH" && "$TARGET_APP" == "Central" ]]; then
            LAUNCH_PATH=$(find /Applications -maxdepth 1 -iname "*Launcher*.app" 2>/dev/null | head -n 1)
          fi
          if [[ -z "$LAUNCH_PATH" ]]; then
            LAUNCH_PATH=$(find /Applications -maxdepth 1 -name "*.app" ! -name "Safari.app" ! -name "System Preferences.app" ! -name "App Store.app" 2>/dev/null | head -n 1)
          fi

          if [[ -n "$LAUNCH_PATH" ]]; then
            echo "==> Pre-launching $LAUNCH_PATH on macOS display..."
            open "$LAUNCH_PATH" || true
          fi

      - name: Start Live Web Remote Console
        run: |
          chmod +x scripts/web_streamer.py
          nohup python3 scripts/web_streamer.py > /tmp/streamer.log 2>&1 &
          sleep 2
          
          nohup bore local 8080 --to bore.pub > /tmp/bore.log 2>&1 &
          sleep 4
          
          cat /tmp/bore.log
          BORE_PORT=$(grep -oE 'listening at bore.pub:[0-9]+' /tmp/bore.log | head -n 1 | awk -F: '{print $NF}' || true)
          
          echo " "
          echo "=========================================================================="
          echo "       🖥️  macOS INTERACTIVE LIVE CONSOLE READY  🖥️                     "
          echo "=========================================================================="
          echo " "
          if [[ -n "$BORE_PORT" ]]; then
            echo "  👉 ENLACE DIRECTO (Abre en Chrome, Edge o tu navegador favorito):"
            echo "     http://bore.pub:${BORE_PORT}"
            echo " "
            echo "     ¡Haz clic en los botones de la app directamente desde tu navegador!"
          fi
          echo "=========================================================================="

      - name: Keep Runner Alive
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: false
