name: Build macOS Packages

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'App to build'
        required: true
        type: choice
        default: 'curve'
        options:
          - 'curve'
          - 'central'
          - 'prism'
          - 'frame'
          - 'reel'
          - 'surface'
          - 'forge'
          - 'anima'
          - 'kinetic'
          - 'lux'
          - 'folio'
          - 'editorial'
          - 'sonic'
          - 'all'
      arch:
        description: 'Target Architecture'
        required: true
        type: choice
        default: 'aarch64'
        options:
          - 'aarch64'
          - 'universal'
          - 'x86_64'
      tag:
        description: 'Release Tag (optional, e.g. v0.24.1; autodetects from Cargo.toml if blank)'
        required: false
        type: string
        default: ''

jobs:
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    strategy:
      fail-fast: false
      matrix:
        app: ${{ inputs.app == 'all' && fromJSON('["curve","central","prism","frame","reel","surface","forge","anima","kinetic","lux","folio","editorial","sonic"]') || fromJSON(format('["{0}"]', inputs.app)) }}

    steps:
      - name: Checkout Builder
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add Target Architectures
        run: |
          if [[ "${{ inputs.arch }}" == "universal" ]]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
          elif [[ "${{ inputs.arch }}" == "aarch64" ]]; then
            rustup target add aarch64-apple-darwin
          else
            rustup target add x86_64-apple-darwin
          fi

      - name: Install Gitea CLI (tea)
        run: |
          echo "==> Installing tea CLI for macOS..."
          curl -sL "https://gitea.com/gitea/tea/releases/download/v0.9.2/tea-0.9.2-darwin-arm64" -o /usr/local/bin/tea
          chmod +x /usr/local/bin/tea
          tea --version
          tea login add --name yumedevs --url https://code.yumedevs.com --token "${{ secrets.FORGE_TOKEN }}"

      - name: Clone from Private Forge (Ephemeral Storage)
        env:
          FORGE_TOKEN: ${{ secrets.FORGE_TOKEN }}
          APP: ${{ matrix.app }}
        run: |
          echo "==> Cloning $APP from private forge into ephemeral runner storage..."
          CLONE_DIR="$RUNNER_TEMP/$APP"
          rm -rf "$CLONE_DIR"
          git clone --depth 1 "https://oauth2:${FORGE_TOKEN}@code.yumedevs.com/Alejandro/${APP}.git" "$CLONE_DIR"
          echo "APP_DIR=$CLONE_DIR" >> "$GITHUB_ENV"

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ matrix.app }}-${{ hashFiles(format('{0}/{1}/Cargo.lock', runner.temp, matrix.app)) }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.app }}-
            ${{ runner.os }}-cargo-

      - name: Build and Package macOS Bundle (.app and .dmg)
        env:
          APP: ${{ matrix.app }}
          ARCH: ${{ inputs.arch }}
          MACOS_SIGN_IDENTITY: "-"
        run: |
          cd "$APP_DIR"
          
          # Read version from Cargo.toml
          VERSION=$(awk '
            /^\[/ { in_pkg = ($0 == "[workspace.package]") ; next }
            in_pkg && $1 == "version" { gsub(/[" ]/, "", $3); print $3; exit }
          ' Cargo.toml)
          
          if [[ -z "$VERSION" ]]; then
            echo "Error: Could not determine version from Cargo.toml" >&2
            exit 1
          fi
          
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "==> Packaging $APP version $VERSION ($ARCH) with ad-hoc signing..."
          
          chmod +x packaging/macos/package.sh
          ./packaging/macos/package.sh --arch "$ARCH"
          
          # Ensure canonical DMG name exists
          DIST="dist/release"
          mkdir -p "$DIST"
          CANONICAL_DMG="$DIST/${APP}-${VERSION}-macos-${ARCH}.dmg"
          
          BUILT_DMG=$(find "$DIST" -maxdepth 1 -name "*.dmg" | head -n 1)
          if [[ -n "$BUILT_DMG" && "$BUILT_DMG" != "$CANONICAL_DMG" ]]; then
            echo "==> Aliasing $BUILT_DMG to $CANONICAL_DMG"
            cp "$BUILT_DMG" "$CANONICAL_DMG"
          fi
          
          ls -lh "$DIST"

      - name: Update Checksums and Upload to Gitea Release
        env:
          APP: ${{ matrix.app }}
          ARCH: ${{ inputs.arch }}
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          cd "$APP_DIR"
          TAG="${TAG_INPUT:-v$VERSION}"
          echo "==> Publishing assets for $APP tag $TAG"
          
          DIST="$APP_DIR/dist/release"
          EXISTING_SUMS=$(curl -s "https://code.yumedevs.com/Alejandro/${APP}/releases/download/${TAG}/SHA256SUMS.txt" 2>/dev/null || true)
          export EXISTING_SUMS
          export APP_DIR
          
          python3 - << 'EOF'
          import os
          import hashlib

          dist_dir = os.path.join(os.environ["APP_DIR"], "dist", "release")
          existing_sums = os.environ.get("EXISTING_SUMS", "")
          
          all_sums = {}
          for line in existing_sums.splitlines():
              parts = line.strip().split(None, 1)
              if len(parts) == 2 and len(parts[0]) == 64:
                  clean_name = parts[1].lstrip("*")
                  all_sums[clean_name] = parts[0]
                  
          for f in os.listdir(dist_dir):
              if f.endswith(".dmg") or f.endswith(".zip"):
                  p = os.path.join(dist_dir, f)
                  h = hashlib.sha256()
                  with open(p, "rb") as bf:
                      while chunk := bf.read(65536):
                          h.update(chunk)
                  all_sums[f] = h.hexdigest()
                  
          sums_path = os.path.join(dist_dir, "SHA256SUMS.txt")
          with open(sums_path, "wb") as sf:
              for fname in sorted(all_sums.keys()):
                  sf.write(f"{all_sums[fname]}  {fname}\n".encode("ascii"))
          print(f"Generated clean SHA256SUMS.txt with {len(all_sums)} checksums.")
          EOF
          
          cat "$DIST/SHA256SUMS.txt"
          
          # Upload via tea CLI
          cd "$DIST"
          for f in *.dmg; do
            if [[ -f "$f" ]]; then
              echo "[-] Removing existing $f from release if present..."
              tea releases assets delete --login yumedevs --repo "Alejandro/$APP" "$TAG" "$f" 2>/dev/null || true
              echo "[+] Uploading $f..."
              tea releases assets create --login yumedevs --repo "Alejandro/$APP" "$TAG" "$f"
            fi
          done
          
          echo "[-] Replacing SHA256SUMS.txt..."
          tea releases assets delete --login yumedevs --repo "Alejandro/$APP" "$TAG" "SHA256SUMS.txt" 2>/dev/null || true
          echo "[+] Uploading updated SHA256SUMS.txt..."
          tea releases assets create --login yumedevs --repo "Alejandro/$APP" "$TAG" "SHA256SUMS.txt"
          
          echo "[✓] All assets successfully published to Gitea release!"
