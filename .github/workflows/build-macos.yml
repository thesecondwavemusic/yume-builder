name: Build macOS Packages

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'App to build'
        required: true
        type: choice
        default: 'curve'
        options:
          - 'curve'
          - 'central'
          - 'prism'
          - 'frame'
          - 'reel'
          - 'surface'
          - 'forge'
          - 'anima'
          - 'kinetic'
          - 'lux'
          - 'folio'
          - 'editorial'
          - 'sonic'
          - 'all'
      arch:
        description: 'Target Architecture'
        required: true
        type: choice
        default: 'aarch64'
        options:
          - 'aarch64'
          - 'universal'
          - 'x86_64'
      tag:
        description: 'Release Tag (optional, e.g. v0.24.1; autodetects from Cargo.toml if blank)'
        required: false
        type: string
        default: ''

jobs:
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    strategy:
      fail-fast: false
      matrix:
        app: ${{ inputs.app == 'all' && fromJSON('["curve","central","prism","frame","reel","surface","forge","anima","kinetic","lux","folio","editorial","sonic"]') || fromJSON(format('["{0}"]', inputs.app)) }}

    steps:
      - name: Checkout Builder
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add Target Architectures
        run: |
          if [[ "${{ inputs.arch }}" == "universal" ]]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
          elif [[ "${{ inputs.arch }}" == "aarch64" ]]; then
            rustup target add aarch64-apple-darwin
          else
            rustup target add x86_64-apple-darwin
          fi

      - name: Clone from Private Forge (Ephemeral Storage)
        env:
          FORGE_TOKEN: ${{ secrets.FORGE_TOKEN }}
          APP: ${{ matrix.app }}
        run: |
          echo "==> Cloning $APP from private forge into ephemeral runner storage..."
          CLONE_DIR="$RUNNER_TEMP/$APP"
          rm -rf "$CLONE_DIR"
          git clone --depth 1 "https://oauth2:${FORGE_TOKEN}@code.yumedevs.com/Alejandro/${APP}.git" "$CLONE_DIR"
          echo "APP_DIR=$CLONE_DIR" >> "$GITHUB_ENV"

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ matrix.app }}-${{ hashFiles(format('{0}/{1}/Cargo.lock', runner.temp, matrix.app)) }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.app }}-
            ${{ runner.os }}-cargo-

      - name: Build and Package macOS Bundle (.app and .dmg)
        env:
          APP: ${{ matrix.app }}
          ARCH: ${{ inputs.arch }}
          MACOS_SIGN_IDENTITY: "-"
        run: |
          cd "$APP_DIR"
          
          # Read version from Cargo.toml
          VERSION=$(awk '
            /^\[/ { in_pkg = ($0 == "[workspace.package]") ; next }
            in_pkg && $1 == "version" { gsub(/[" ]/, "", $3); print $3; exit }
          ' Cargo.toml)
          
          if [[ -z "$VERSION" ]]; then
            echo "Error: Could not determine version from Cargo.toml" >&2
            exit 1
          fi
          
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "==> Packaging $APP version $VERSION ($ARCH) with ad-hoc signing..."
          
          chmod +x packaging/macos/package.sh
          ./packaging/macos/package.sh --arch "$ARCH"
          
          # Ensure canonical DMG name exists
          DIST="dist/release"
          mkdir -p "$DIST"
          CANONICAL_DMG="$DIST/${APP}-${VERSION}-macos-${ARCH}.dmg"
          
          BUILT_DMG=$(find "$DIST" -maxdepth 1 -name "*.dmg" | head -n 1)
          if [[ -n "$BUILT_DMG" && "$BUILT_DMG" != "$CANONICAL_DMG" ]]; then
            echo "==> Aliasing $BUILT_DMG to $CANONICAL_DMG"
            cp "$BUILT_DMG" "$CANONICAL_DMG"
          fi
          
          ls -lh "$DIST"

      - name: Update Checksums and Upload to Gitea Release
        env:
          APP: ${{ matrix.app }}
          ARCH: ${{ inputs.arch }}
          TAG_INPUT: ${{ inputs.tag }}
          FORGE_TOKEN: ${{ secrets.FORGE_TOKEN }}
        run: |
          cd "$APP_DIR"
          TAG="${TAG_INPUT:-v$VERSION}"
          echo "==> Publishing assets for $APP tag $TAG via Gitea REST API"
          
          python3 - << 'EOF'
          import os, sys, json, urllib.request, hashlib, subprocess

          token = os.environ["FORGE_TOKEN"]
          app = os.environ["APP"]
          tag = os.environ.get("TAG_INPUT") or f"v{os.environ['VERSION']}"
          app_dir = os.environ["APP_DIR"]
          dist_dir = os.path.join(app_dir, "dist", "release")

          # 1. Fetch release details from Gitea REST API
          rel_url = f"https://code.yumedevs.com/api/v1/repos/Alejandro/{app}/releases/tags/{tag}"
          req = urllib.request.Request(rel_url, headers={"Authorization": f"token {token}", "Accept": "application/json"})
          try:
              with urllib.request.urlopen(req) as resp:
                  rel_data = json.loads(resp.read().decode())
          except Exception as e:
              print(f"Error fetching release {tag}: {e}", file=sys.stderr)
              sys.exit(1)

          rel_id = rel_data["id"]
          existing_assets = {a["name"]: a["id"] for a in rel_data.get("assets", [])}
          print(f"Found release {tag} (ID {rel_id}) with {len(existing_assets)} existing assets.")

          # 2. Merge existing SHA256SUMS.txt with newly built artifacts
          existing_sums = ""
          if "SHA256SUMS.txt" in existing_assets:
              try:
                  sums_url = f"https://code.yumedevs.com/Alejandro/{app}/releases/download/{tag}/SHA256SUMS.txt"
                  with urllib.request.urlopen(sums_url) as sresp:
                      existing_sums = sresp.read().decode("utf-8", errors="ignore")
              except Exception as e:
                  print("Could not fetch remote SHA256SUMS.txt:", e)

          all_sums = {}
          for line in existing_sums.splitlines():
              parts = line.strip().split(None, 1)
              if len(parts) == 2 and len(parts[0]) == 64:
                  all_sums[parts[1].lstrip("*")] = parts[0]

          for f in sorted(os.listdir(dist_dir)):
              if f.endswith(".dmg") or f.endswith(".zip"):
                  p = os.path.join(dist_dir, f)
                  h = hashlib.sha256()
                  with open(p, "rb") as bf:
                      while chunk := bf.read(65536):
                          h.update(chunk)
                  all_sums[f] = h.hexdigest()

          sums_path = os.path.join(dist_dir, "SHA256SUMS.txt")
          with open(sums_path, "wb") as sf:
              for fname in sorted(all_sums.keys()):
                  sf.write(f"{all_sums[fname]}  {fname}\n".encode("ascii"))

          print("Generated clean SHA256SUMS.txt:")
          with open(sums_path, "r") as sf:
              print(sf.read())

          # 3. Upload built assets and updated SHA256SUMS.txt
          files_to_upload = sorted([f for f in os.listdir(dist_dir) if f.endswith(".dmg") or f == "SHA256SUMS.txt"])
          
          for f in files_to_upload:
              fpath = os.path.join(dist_dir, f)
              if f in existing_assets:
                  aid = existing_assets[f]
                  print(f"[-] Deleting existing asset {f} (ID {aid})...")
                  del_url = f"https://code.yumedevs.com/api/v1/repos/Alejandro/{app}/releases/{rel_id}/assets/{aid}"
                  subprocess.run(["curl", "-s", "-X", "DELETE", "-H", f"Authorization: token {token}", del_url], check=True)

              print(f"[+] Uploading {f}...")
              up_url = f"https://code.yumedevs.com/api/v1/repos/Alejandro/{app}/releases/{rel_id}/assets"
              res = subprocess.run(
                  ["curl", "-s", "-f", "-X", "POST", "-H", f"Authorization: token {token}", "-F", f"attachment=@{fpath}", up_url],
                  capture_output=True, text=True
              )
              if res.returncode != 0:
                  print(f"Error uploading {f}: {res.stderr}", file=sys.stderr)
                  sys.exit(1)
              print(f"[✓] Successfully uploaded {f}!")

          print("[✓] All release assets successfully published to Gitea!")
          EOF
